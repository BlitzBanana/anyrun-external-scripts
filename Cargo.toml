[package]
name = "anyrun-external-script"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyrun-plugin = { git = "https://github.com/anyrun-org/anyrun" }
abi_stable = "0.11.1"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0"
ron = "0.11.0"
textdistance = "1.1.1"
rust-fuzzy-search = "0.1.1"
rand = "0.9.2"
